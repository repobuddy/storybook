packages:
  - apps/*
  - libs/*
  - tools/*
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  fsevents: true
# Supply-chain soak: no dependency may be installed until it is 24h old.
# Strict mode makes a new, too-young resolution fail instead of being silently
# waived, so every waiver below is a deliberate, exact-version decision.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# First-party packages are exempt from the soak.
#
# The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
# within hours of publication. It does not describe our own packages: we control what
# goes into them, and a first-party release is reviewed before it is published, not
# after. Applying it to ourselves only means a fresh publish is invisible to the next
# repo in the chain for 24h.
minimumReleaseAgeExclude:
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'
overrides:
  # GHSA: Rollup 4 arbitrary file write via path traversal, fixed in 4.59.0.
  # rollup is only here as @storybook/csf-plugin's optional `*` peer, so no
  # manifest declares it and `pnpm update` cannot move it.
  rollup: '^4.63.1'
patchedDependencies:
  storybook-addon-tag-badges: patches/storybook-addon-tag-badges.patch
