# Deliberately empty.
#
# Without this file the repo inherits repobuddy/.github's org-level Mergify
# rules, which merge ANY bot pull request with `method: rebase` and no check
# conditions at all — including updates to the published package's runtime
# `dependencies`, which need a changeset before they may land.
